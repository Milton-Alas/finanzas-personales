services:
  - type: web
    name: finanzas-personales
    env: docker
    plan: free
    region: oregon
    # Para servicios Docker, Render construye la imagen automáticamente desde el Dockerfile.
    # Usamos el ENTRYPOINT definido en el Dockerfile (/usr/local/bin/entrypoint.sh).
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: finanzas-db
          property: connectionString
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: SESSION_HTTP_ONLY
        value: true
      - key: SESSION_SAME_SITE
        value: lax
      - key: PROXIES
        value: "*"


databases:
  - name: finanzas-db
    databaseName: finanzas
    user: finanzas_user
    plan: free
    region: oregon
